name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell parser check
        shell: pwsh
        run: |
          $files = @("bootstrap.ps1", "src/Safe-Windows-Cleanup.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "Parser errors in $file"
              $errors | Format-List | Out-String | Write-Host
              exit 1
            }
          }
          Write-Host "Parser checks passed."
