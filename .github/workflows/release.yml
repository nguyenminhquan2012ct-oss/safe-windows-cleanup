name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v4.0.0'
        required: true
        type: string

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create archive
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          $zip = "Safe-Windows-Cleanup-$version.zip"
          Compress-Archive -Path * -DestinationPath $zip -Force
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Safe Windows Cleanup ${{ inputs.version }}
          files: Safe-Windows-Cleanup-${{ inputs.version }}.zip
